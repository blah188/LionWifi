name=LionWifi
version=1.3.1
author=leva <leva.the.lion@gmail.com>
maintainer=leva <leva.the.lion@gmail.com>
sentence=WiFi connection manager with ArduinoOTA, a web filesystem browser and a status page, for ESP8266 and ESP32.
paragraph=Pumps the WiFi state machine (multi-SSID connect, auto-reconnect, AP rotation, optional router-ping reboot), sets time over NTP, rotates logs, runs ArduinoOTA, and serves a SPIFFS/LittleFS/SD file browser (list/upload/download/tail/rename/delete) plus log views over ESP8266WebServer or (ESP32) ESPAsyncWebServer/WebServer. The consumer defines three globals (the LionLogger `Logger`, the web `server`, and `WifiConnector *_connector`) and selects a filesystem with -D USE_SPIFFS or -D LFS. Single-instance, non-copyable. Depends on LionArray, LionLogger, LionStreams, and LionTask (ESP8266) / LionRtosTask (ESP32). The ESP32 async web path also needs ESPAsyncWebServer + AsyncTCP.
category=Communication
url=https://github.com/blah188/LionWifi
architectures=esp8266,esp32
depends=LionArray,LionLogger,LionStreams,LionTask,LionRtosTask
includes=WifiConnector.h
